services:
  redis:
    image: redis:7-alpine
    container_name: crp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: crp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crp_user
      POSTGRES_PASSWORD: crp_password
      POSTGRES_DB: crp_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crp_user -d crp_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  pg_data:
