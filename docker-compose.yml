services:
  redis:
    image: redis:7-alpine
    container_name: crp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: crp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crp_user
      POSTGRES_PASSWORD: crp_password
      POSTGRES_DB: crp_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crp_user -d crp_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://crp_user:crp_password@postgres:5432/crp_db
      - REDIS_URL=redis://redis:6379/0
      - DB_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crp_worker
    restart: unless-stopped
    command: ["arq", "src.worker.worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://crp_user:crp_password@postgres:5432/crp_db
      - REDIS_URL=redis://redis:6379/0
      - DB_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  redis_data:
  pg_data:
