target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "E501", # line too long (prompts and schemas contain natural text)
]

[lint.per-file-ignores]
"src/main.py" = ["E402"] # limiter circular import

[lint.isort]
known-first-party = ["src"]
